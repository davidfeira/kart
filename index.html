                        <span class="stat-label">Accel</span>
                        <div class="stat-fill">
                            <div class="stat-fill-inner" style="width: ${config.stats.accel * 20}%; background: linear-gradient(90deg, #44ff44, #88ff44)"></div>
                        </div>
                    </div>
                    <div class="stat-bar">
                        <span class="stat-label">Handle</span>
                        <div class="stat-fill">
                            <div class="stat-fill-inner" style="width: ${config.stats.handling * 20}%; background: linear-gradient(90deg, #4444ff, #44ffff)"></div>
                        </div>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => {
                container.querySelectorAll('.select-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                this.selectedKart = key;
            });

            container.appendChild(card);
        });

        // Create 3D previews after DOM is ready
        setTimeout(() => this.createKartPreviews(), 50);
    }

    createKartPreviews() {
        Object.keys(KART_TYPES).forEach(key => {
            const container = document.getElementById(`kart-preview-${key}`);
            if (!container) return;

            // Create mini renderer
            const width = 150;
            const height = 100;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Create scene
            const scene = new THREE.Scene();

            // Camera
            const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
            camera.position.set(3, 2, 3);
            camera.lookAt(0, 0.3, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const directional = new THREE.DirectionalLight(0xffffff, 0.8);
            directional.position.set(5, 5, 5);
            scene.add(directional);

            // Add kart
            const kart = createKartGeometry(key);
            kart.scale.set(0.8, 0.8, 0.8);
            scene.add(kart);

            this.kartPreviews.push({ renderer, scene, camera, kart });
        });

        // Start preview animation
        this.animateKartPreviews();
    }

    animateKartPreviews() {
        if (!this.kartPreviews || this.kartPreviews.length === 0) return;

        this.kartPreviews.forEach(preview => {
            preview.kart.rotation.y += 0.01;
            preview.renderer.render(preview.scene, preview.camera);
        });

        requestAnimationFrame(() => this.animateKartPreviews());
    }

    setupTrackSelect() {
        const container = document.getElementById('track-options');
        container.innerHTML = '';

        Object.entries(TRACK_PRESETS).forEach(([key, config]) => {
            const card = document.createElement('div');
            card.className = 'select-card track-card' + (key === this.selectedTrack ? ' selected' : '');
            card.dataset.track = key;

            // Difficulty stars
            const stars = '★'.repeat(config.difficulty) + '☆'.repeat(3 - config.difficulty);

            card.innerHTML = `
                <div class="preview" id="track-preview-${key}">
                    <canvas id="track-minimap-${key}" width="240" height="160"></canvas>
                </div>
                <div class="name">${config.name}</div>
                <div class="description">${config.description}</div>
                <div class="stats" style="color: #ffd700">${stars}</div>
            `;

            card.addEventListener('click', () => {
                container.querySelectorAll('.select-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                this.selectedTrack = key;
            });

            container.appendChild(card);
        });

        // Draw minimaps
        setTimeout(() => this.drawMinimaps(), 100);
    }

    drawMinimaps() {
        Object.entries(TRACK_PRESETS).forEach(([key, preset]) => {
            const canvas = document.getElementById(`track-minimap-${key}`);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const points = preset.generatePath();

            // Find bounds
            let minX = Infinity, maxX = -Infinity;
            let minZ = Infinity, maxZ = -Infinity;
            points.forEach(p => {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minZ = Math.min(minZ, p.z);
                maxZ = Math.max(maxZ, p.z);
            });

            const padding = 20;
            const scaleX = (canvas.width - padding * 2) / (maxX - minX);
            const scaleZ = (canvas.height - padding * 2) / (maxZ - minZ);
            const scale = Math.min(scaleX, scaleZ);

            const offsetX = (canvas.width - (maxX - minX) * scale) / 2;
            const offsetZ = (canvas.height - (maxZ - minZ) * scale) / 2;

            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            points.forEach((p, i) => {
                const x = (p.x - minX) * scale + offsetX;
                const z = (p.z - minZ) * scale + offsetZ;
                if (i === 0) ctx.moveTo(x, z);
                else ctx.lineTo(x, z);
            });
            ctx.closePath();
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Start position marker
            const start = points[0];
            const sx = (start.x - minX) * scale + offsetX;
            const sz = (start.z - minZ) * scale + offsetZ;
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(sx, sz, 6, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    setupButtons() {
        document.querySelectorAll('.menu-btn, .confirm-btn, .back-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                this.handleAction(action);
            });
        });
    }

    handleAction(action) {
        switch(action) {
            case 'start':
                this.showScreen('kart-select');
                break;
            case 'controls':
                // Could show controls overlay
                break;
            case 'confirm':
                if (!this.kartSelect.classList.contains('hidden')) {
                    this.showScreen('track-select');
                } else if (!this.trackSelect.classList.contains('hidden')) {
                    this.game.startRace(this.selectedKart, this.selectedTrack);
                }
                break;
            case 'back':
                if (!this.kartSelect.classList.contains('hidden')) {
                    this.showScreen('main-menu');
                } else if (!this.trackSelect.classList.contains('hidden')) {
                    this.showScreen('kart-select');
                }
                break;
            case 'resume':
                this.game.resumeRace();
                break;
            case 'restart':
                this.game.restartRace();
                break;
            case 'quit':
                this.game.quitToMenu();
                break;
        }
    }

    showScreen(screenId) {
        // Hide all screens
        [this.mainMenu, this.kartSelect, this.trackSelect,
         this.loading, this.pauseMenu, this.finishScreen].forEach(screen => {
            screen.classList.add('hidden');
        });

        // Show requested screen
        const screen = document.getElementById(screenId);
        if (screen) {
            screen.classList.remove('hidden');
        }
    }

    hideAll() {
        [this.mainMenu, this.kartSelect, this.trackSelect,
         this.loading, this.pauseMenu, this.finishScreen].forEach(screen => {
            screen.classList.add('hidden');
        });
    }

    showLoading(progress) {
        this.showScreen('loading');
        document.getElementById('loading-bar').style.width = `${progress * 100}%`;
    }

    async showCountdown() {
        this.countdown.classList.remove('hidden');
        const numberEl = document.getElementById('countdown-number');

        for (let i = 3; i >= 1; i--) {
            numberEl.textContent = i;
            numberEl.className = 'countdown-number';
            await new Promise(r => setTimeout(r, 1000));
        }

        numberEl.textContent = 'GO!';
        numberEl.className = 'countdown-number go';
        await new Promise(r => setTimeout(r, 500));

        this.countdown.classList.add('hidden');
    }

    showPause() {
        this.pauseMenu.classList.remove('hidden');
    }

    hidePause() {
        this.pauseMenu.classList.add('hidden');
    }

    showFinish(totalTime, lapTimes) {
        this.finishScreen.classList.remove('hidden');

        document.getElementById('finish-total-time').textContent = this.formatTime(totalTime);

        const lapTimesEl = document.getElementById('lap-times');
        lapTimesEl.innerHTML = '';

        const bestLap = Math.min(...lapTimes);
        lapTimes.forEach((time, i) => {
            const row = document.createElement('div');
            row.className = 'lap-time-row' + (time === bestLap ? ' best' : '');
            row.textContent = `Lap ${i + 1}: ${this.formatTime(time)}`;
            lapTimesEl.appendChild(row);
        });
    }

    formatTime(ms) {
        const totalSeconds = ms / 1000;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = Math.floor(totalSeconds % 60);
        const millis = Math.floor((totalSeconds % 1) * 1000);
        return `${minutes}:${seconds.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
    }
}

// ============= HUD =============
class HUDController {
    constructor() {
        this.hud = document.getElementById('hud');
        this.timerEl = document.getElementById('hud-timer');
        this.lapEl = document.getElementById('hud-lap');
        this.speedEl = document.getElementById('hud-speed');
        this.driftEl = document.getElementById('hud-drift');
    }

    show() {
        this.hud.classList.remove('hidden');
    }

    hide() {
        this.hud.classList.add('hidden');
    }

    update(time, lap, totalLaps, speed, isDrifting, driftBoostLevel = 0) {
        this.timerEl.textContent = this.formatTime(time);
        this.lapEl.textContent = `LAP ${lap}/${totalLaps}`;
        // Speed display scales for more impressive numbers
        this.speedEl.textContent = Math.abs(Math.round(speed * 1.5));

        // Drift indicator with boost level colors
        if (isDrifting) {
            this.driftEl.classList.add('active');

            // Change color based on boost level
            if (driftBoostLevel >= 3) {
                this.driftEl.textContent = 'MAX BOOST!';
                this.driftEl.style.color = '#00ffff';
                this.driftEl.style.textShadow = '0 0 20px #00ffff, 0 0 40px #00ffff';
            } else if (driftBoostLevel >= 2) {
                this.driftEl.textContent = 'BOOST!';
                this.driftEl.style.color = '#ffaa00';
                this.driftEl.style.textShadow = '0 0 15px #ffaa00, 0 0 30px #ff6600';
            } else if (driftBoostLevel >= 1) {
                this.driftEl.textContent = 'DRIFT!';
                this.driftEl.style.color = '#ffff00';
                this.driftEl.style.textShadow = '0 0 10px #ffff00';
            } else {
                this.driftEl.textContent = 'DRIFT!';
                this.driftEl.style.color = '#ffffff';
                this.driftEl.style.textShadow = '0 0 5px #ffffff';
            }
        } else {
            this.driftEl.classList.remove('active');
            this.driftEl.textContent = 'DRIFT!';
            this.driftEl.style.color = '';
            this.driftEl.style.textShadow = '';
        }
    }

    formatTime(ms) {
        const totalSeconds = ms / 1000;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = Math.floor(totalSeconds % 60);
        const millis = Math.floor((totalSeconds % 1) * 1000);
        return `${minutes}:${seconds.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
    }
}

// ============= GAME =============
class Game {
    constructor() {
        this.state = 'MENU';
        this.previousState = null;

        gameLog.info('Game initializing');

        // Three.js setup
        this.canvas = document.getElementById('game-canvas');
        this.renderer = new THREE.WebGLRenderer({
            canvas: this.canvas,
            antialias: true
        });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        this.scene = new THREE.Scene();

        // Create dynamic sky shader
        this.skyMaterial = this.createSkyShader();
        const skyGeometry = new THREE.SphereGeometry(400, 32, 32);
        this.skyMesh = new THREE.Mesh(skyGeometry, this.skyMaterial);
        this.skyMesh.renderOrder = -1; // Render behind everything
        this.scene.add(this.skyMesh);

        this.scene.fog = new THREE.Fog(0x8090a0, 200, 500); // Light blue-gray fog

        this.camera = new THREE.PerspectiveCamera(
            CONFIG.camera.baseFov,
            window.innerWidth / window.innerHeight,
            0.1,
            600
        );

        // Lighting
        this.setupLighting();

        // Systems
        this.input = new InputManager();
        this.menuManager = new MenuManager(this);
        this.hud = new HUDController();
        this.trackGenerator = new TrackGenerator(this.scene);
        this.cameraController = null;
        this.checkpointManager = null;

        // Game objects
        this.kart = null;

        // Timing
        this.clock = new THREE.Clock();
        this.raceTime = 0;
        this.isPaused = false;

        // Window resize
        window.addEventListener('resize', () => this.onResize());

        // Start render loop
        this.animate();
    }

    createSkyShader() {
        const vertexShader = `
            varying vec3 vPosition;
            void main() {
                vPosition = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec3 vPosition;

            void main() {
                vec3 direction = normalize(vPosition);
                float elevation = direction.y;

                // Simple clean gradient - deep blue at top, lighter blue at horizon
                vec3 zenith = vec3(0.15, 0.25, 0.45);
                vec3 midSky = vec3(0.4, 0.55, 0.75);
                vec3 horizon = vec3(0.7, 0.75, 0.8);

                vec3 skyColor;
                if (elevation > 0.0) {
                    // Above horizon: blend from horizon up to zenith
                    float t = smoothstep(0.0, 1.0, elevation);
                    skyColor = mix(horizon, midSky, smoothstep(0.0, 0.3, elevation));
                    skyColor = mix(skyColor, zenith, smoothstep(0.3, 0.8, elevation));
                } else {
                    // Below horizon: fade to slightly darker
                    vec3 below = vec3(0.5, 0.55, 0.6);
                    skyColor = mix(horizon, below, smoothstep(0.0, -0.5, elevation));
                }

                gl_FragColor = vec4(skyColor, 1.0);
            }
        `;

        return new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            side: THREE.BackSide,
            depthWrite: false,
            depthTest: true
        });
    }

    setupLighting() {
        // Ambient light - warmer for sunset atmosphere
        const ambient = new THREE.AmbientLight(0xffd4aa, 0.6);
        this.scene.add(ambient);

        // Directional light (sun) - positioned lower for sunset effect
        const sun = new THREE.DirectionalLight(0xffaa77, 1.2);
        sun.position.set(50, 30, 50); // Lower angle for sunset
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 10;
        sun.shadow.camera.far = 300;
        sun.shadow.camera.left = -100;
        sun.shadow.camera.right = 100;
        sun.shadow.camera.top = 100;
        sun.shadow.camera.bottom = -100;
        this.scene.add(sun);

        // Hemisphere light for sky/ground color - sunset tones
        const hemi = new THREE.HemisphereLight(0xff9966, 0x2d4a5a, 0.4);
        this.scene.add(hemi);
    }

    onResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    }

    async startRace(kartType, trackType) {
        this.state = 'LOADING';
        gameLog.info('Starting race', { kartType, trackType });
        this.menuManager.showLoading(0);

        await new Promise(r => setTimeout(r, 100));
        this.menuManager.showLoading(0.3);

        // Generate track
        const trackData = this.trackGenerator.generate(trackType);
        this.menuManager.showLoading(0.6);

        await new Promise(r => setTimeout(r, 100));

        // Create kart
        if (this.kart) this.kart.dispose();
        this.kart = new Kart(kartType, this.scene);
        this.kart.reset(trackData.startPosition, trackData.startRotation);

        // Setup camera
        this.cameraController = new CameraController(this.camera);
        this.cameraController.reset(trackData.startPosition, trackData.startRotation);

        // Setup checkpoints
        this.checkpointManager = new CheckpointManager(trackData.checkpoints);

        this.menuManager.showLoading(1.0);
        await new Promise(r => setTimeout(r, 200));

        // Countdown
        this.state = 'COUNTDOWN';
        this.menuManager.hideAll();
        this.hud.show();
        this.input.showTouchControls(true);
        this.hud.update(0, 1, CONFIG.race.totalLaps, 0, false);

        await this.menuManager.showCountdown();

        // Start race
        this.state = 'RACING';
        this.raceTime = 0;
        this.checkpointManager.reset(0);
        this.clock.start();
        gameLog.info('Race started', { totalLaps: CONFIG.race.totalLaps });
    }

    resumeRace() {
        this.state = 'RACING';
        this.isPaused = false;
        this.menuManager.hidePause();
        this.input.showTouchControls(true);
        this.clock.start();
        gameLog.info('Race resumed');
    }

    restartRace() {
        const kartType = this.kart.type;
        gameLog.info('Race restarting', { kartType });
        this.menuManager.hideAll();
        this.startRace(kartType, this.menuManager.selectedTrack);
    }

    quitToMenu() {
        gameLog.info('Quitting to menu');
        this.state = 'MENU';
        this.isPaused = false;

        if (this.kart) {
            this.kart.dispose();
            this.kart = null;
        }

        this.trackGenerator.clear();
        this.hud.hide();
        this.input.showTouchControls(false);
        this.menuManager.showScreen('main-menu');
    }

    update() {
        const delta = this.clock.getDelta();

        // Handle pause toggle
        if (this.input.consumePause()) {
            if (this.state === 'RACING') {
                this.state = 'PAUSED';
                this.isPaused = true;
                this.menuManager.showPause();
                this.input.showTouchControls(false);
                this.clock.stop();
                gameLog.info('Race paused', { raceTime: this.raceTime });
            } else if (this.state === 'PAUSED') {
                this.resumeRace();
            }
        }

        // Handle enter key for menu
        if (this.input.consumeEnter()) {
            if (this.state === 'MENU') {
                this.menuManager.handleAction('start');
            }
        }

        if (this.state !== 'RACING') return;

        // Update race time
        this.raceTime += delta * 1000;

        // Update kart physics (movement, steering, drift)
        this.kart.update(this.input.keys, delta);

        // Get ground info for physics
        const groundInfo = this.trackGenerator.getGroundInfo(this.kart.position);

        // Apply gravity
        this.kart.applyGravity(delta);

        // Apply ground physics (spring-damper suspension)
        if (groundInfo.found) {
            this.kart.applyGroundPhysics(groundInfo.height, groundInfo.normal, delta);
        } else {
            this.kart.isGrounded = false;
        }

        // Sync mesh Y position
        this.kart.mesh.position.y = this.kart.position.y;

        // Check track boundaries
        const collision = this.trackGenerator.getTrackBoundaryCollision(
            this.kart.position,
            this.kart.boundingRadius
        );

        if (collision.collision) {
            this.kart.applyCollision(collision.normal, collision.penetration);
        }

        // Update camera with boost shake effect
        this.cameraController.update(
            this.kart.position,
            this.kart.rotation,
            this.kart.forwardSpeed,
            this.kart.boostTimeRemaining > 0
        );

        // Check checkpoints
        const checkpointEvent = this.checkpointManager.update(
            this.kart.position,
            this.raceTime
        );

        if (checkpointEvent) {
            if (checkpointEvent.type === 'lap') {
                // Flash effect or sound for new lap
            } else if (checkpointEvent.type === 'finish') {
                this.state = 'FINISHED';
                this.menuManager.showFinish(
                    checkpointEvent.totalTime,
                    this.checkpointManager.lapTimes
                );
                this.hud.hide();
                this.input.showTouchControls(false);
            }
        }

        // Update HUD with drift boost level indicator
        this.hud.update(
            this.raceTime,
            this.checkpointManager.lap,
            CONFIG.race.totalLaps,
            this.kart.forwardSpeed,
            this.kart.isDrifting,
            this.kart.driftBoostLevel
        );
    }

    animate() {
        requestAnimationFrame(() => this.animate());

        this.update();

        // Keep skybox centered on camera
        if (this.skyMesh) {
            this.skyMesh.position.copy(this.camera.position);
        }

        this.renderer.render(this.scene, this.camera);
    }
}

// ============= INITIALIZATION =============
gameLog.info('Application starting');
const game = new Game();
gameLog.info('Application ready');
    </script>
