<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kart Racing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- Main Menu -->
    <div id="main-menu" class="menu-overlay">
        <h1 class="menu-title">KART RACING</h1>
        <p class="menu-subtitle">Press ENTER to Start</p>
        <div class="menu-buttons">
            <button class="menu-btn selected" data-action="start">START RACE</button>
        </div>
        <div class="controls-hint">
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move
            <kbd>SPACE</kbd> Drift
            <kbd>ESC</kbd> Pause
        </div>
    </div>

    <!-- Kart Select -->
    <div id="kart-select" class="menu-overlay hidden">
        <div class="select-screen">
            <button class="back-btn" data-action="back">← BACK</button>
            <h2 class="select-title">SELECT YOUR KART</h2>
            <div class="select-container" id="kart-options"></div>
            <button class="confirm-btn" data-action="confirm">SELECT</button>
        </div>
    </div>

    <!-- Track Select -->
    <div id="track-select" class="menu-overlay hidden">
        <div class="select-screen">
            <button class="back-btn" data-action="back">← BACK</button>
            <h2 class="select-title">SELECT TRACK</h2>
            <div class="select-container" id="track-options"></div>
            <button class="confirm-btn" data-action="confirm">RACE!</button>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="menu-overlay loading-overlay hidden">
        <p class="loading-text">LOADING TRACK...</p>
        <div class="loading-bar">
            <div class="loading-bar-fill" id="loading-bar"></div>
        </div>
    </div>

    <!-- Countdown -->
    <div id="countdown" class="countdown-overlay hidden">
        <div class="countdown-number" id="countdown-number">3</div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hud hidden">
        <div class="hud-top">
            <div class="hud-timer" id="hud-timer">0:00.000</div>
            <div class="hud-lap" id="hud-lap">LAP 1/3</div>
        </div>
        <div class="hud-bottom">
            <span class="hud-speed" id="hud-speed">0</span>
            <span class="hud-speed-unit">KM/H</span>
        </div>
        <div class="hud-drift" id="hud-drift">DRIFT!</div>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="menu-overlay pause-overlay hidden">
        <h2 class="pause-title">PAUSED</h2>
        <div class="menu-buttons">
            <button class="menu-btn selected" data-action="resume">RESUME</button>
            <button class="menu-btn" data-action="restart">RESTART</button>
            <button class="menu-btn" data-action="quit">QUIT TO MENU</button>
        </div>
    </div>

    <!-- Finish Screen -->
    <div id="finish-screen" class="menu-overlay finish-overlay hidden">
        <h2 class="finish-title">FINISH!</h2>
        <div class="finish-time" id="finish-total-time">0:00.000</div>
        <p class="finish-label">TOTAL TIME</p>
        <div class="lap-times" id="lap-times"></div>
        <div class="menu-buttons">
            <button class="menu-btn selected" data-action="restart">RACE AGAIN</button>
            <button class="menu-btn" data-action="quit">MAIN MENU</button>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="touch-controls" class="touch-controls hidden">
        <div id="joystick-zone" class="joystick-zone">
            <div id="joystick-base" class="joystick-base">
                <div id="joystick-thumb" class="joystick-thumb"></div>
            </div>
        </div>
        <div id="touch-buttons" class="touch-buttons">
            <button id="drift-btn" class="touch-btn drift-btn">DRIFT</button>
            <button id="pause-btn" class="touch-btn pause-btn">❚❚</button>
        </div>
    </div>

    <script type="importmap">

    <script type="module">
import * as THREE from 'three';

// ============= LOGGER (embedded for file:// compatibility) =============
const LOG_LEVELS = { DEBUG: 0, INFO: 1, WARN: 2, ERROR: 3 };
const LOG_LEVEL_NAMES = ['DEBUG', 'INFO', 'WARN', 'ERROR'];
const LOG_CATEGORIES = { GAME: 'game', PHYSICS: 'physics', NETWORK: 'network', ERROR: 'error' };
const MODULE_CATEGORY_MAP = {
    'Game': 'game', 'Menu': 'game', 'HUD': 'game', 'Checkpoint': 'game', 'Camera': 'game', 'Input': 'game',
    'Physics': 'physics', 'Kart': 'physics', 'Track': 'physics', 'Collision': 'physics'
};

class LoggerCore {
    constructor() {
        this._logs = { game: [], physics: [], network: [], error: [] };
        this._minLevel = LOG_LEVELS.DEBUG;
        this._maxLogsPerCategory = 1000;
        this._enableConsole = true;
    }
    getLogger(moduleName) {
        return {
            debug: (msg, data) => this._log(0, moduleName, msg, data),
            info: (msg, data) => this._log(1, moduleName, msg, data),
            warn: (msg, data) => this._log(2, moduleName, msg, data),
            error: (msg, data) => this._log(3, moduleName, msg, data)
        };
    }
    _log(level, moduleName, message, data) {
        if (level < this._minLevel) return;
        const timestamp = new Date().toISOString();
        const levelName = LOG_LEVEL_NAMES[level];
        let formatted = `[${timestamp}] [${levelName}] [${moduleName}] ${message}`;
        if (data !== undefined) try { formatted += ` ${JSON.stringify(data)}`; } catch (e) {}
        const category = MODULE_CATEGORY_MAP[moduleName] || 'game';
        this._logs[category].push({ timestamp, level: levelName, module: moduleName, message, formatted });
        if (this._logs[category].length > this._maxLogsPerCategory) this._logs[category].shift();
        if (level === LOG_LEVELS.ERROR) this._logs.error.push({ timestamp, level: levelName, module: moduleName, message, formatted });
        if (this._enableConsole) {
            const methods = [console.debug, console.info, console.warn, console.error];
            methods[level](formatted);
        }
    }
    downloadLogs(category = null) {
        const logs = category ? this._logs[category] || [] : Object.values(this._logs).flat();
        const content = logs.map(e => e.formatted).join('\n');
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = category ? `${category}.log` : 'game_all.log';
        a.click(); URL.revokeObjectURL(a.href);
    }
}
const Logger = new LoggerCore();

// Initialize loggers for each module
const gameLog = Logger.getLogger('Game');
const inputLog = Logger.getLogger('Input');
const kartLog = Logger.getLogger('Kart');
const trackLog = Logger.getLogger('Track');
const checkpointLog = Logger.getLogger('Checkpoint');

const TRACK_PRESETS = {
    oval: {
        name: 'Oval Speedway',
        description: 'Simple oval track - perfect for beginners',
        difficulty: 1,
        generatePath: () => {
            const points = [];
            const a = 150, b = 80; // ellipse radii (larger for high-speed racing)
            for (let i = 0; i <= 64; i++) {
                const t = (i / 64) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(t) * a, 0, Math.sin(t) * b));
            }
            return points;
        }
    },
    figure8: {
        name: 'Figure 8',
        description: 'Crossover track with a bridge section',
        difficulty: 2,
        generatePath: () => {
            const points = [];
            const scale = 35;
            for (let i = 0; i <= 64; i++) {
                const t = (i / 64) * Math.PI * 2;
                // Lemniscate of Bernoulli (figure 8)
                const denom = 1 + Math.sin(t) * Math.sin(t);
                const x = (scale * Math.cos(t)) / denom;
                const z = (scale * Math.sin(t) * Math.cos(t)) / denom;
                // Add height variation at crossover
                const y = Math.abs(Math.sin(t * 2)) * 3;
                points.push(new THREE.Vector3(x * 1.5, y, z * 2));
            }
            return points;
        }
    },
    circuit: {
        name: 'Grand Circuit',
        description: 'S-curves, hairpin, and hill sections',
        difficulty: 3,
        generatePath: () => {
            const points = [];
            // Custom circuit shape
            const segments = [
                { type: 'straight', length: 40, dir: 0 },
                { type: 'curve', radius: 20, angle: 90, dir: 1 },
                { type: 'straight', length: 25, dir: 90 },
                { type: 'curve', radius: 15, angle: 135, dir: 1 },
                { type: 'straight', length: 30, dir: 225 },
                { type: 'curve', radius: 25, angle: 90, dir: -1 },
                { type: 'straight', length: 20, dir: 135 },
                { type: 'curve', radius: 12, angle: 180, dir: 1 }, // Hairpin
                { type: 'straight', length: 35, dir: -45 },
                { type: 'curve', radius: 30, angle: 75, dir: -1 },
            ];

            let pos = new THREE.Vector3(-30, 0, -40);
            let angle = 0;

            for (let i = 0; i <= 80; i++) {
                const t = i / 80;
                const theta = t * Math.PI * 2;
                // Create a more interesting circuit
                const r = 40 + Math.sin(theta * 3) * 15 + Math.cos(theta * 2) * 10;
                const x = Math.cos(theta) * r;
                const z = Math.sin(theta) * r * 0.7;
                const y = Math.sin(theta * 2) * 2 + Math.max(0, Math.sin(theta * 4) * 3);
                points.push(new THREE.Vector3(x, y, z));
            }
            return points;
        }
    },
    drift: {
        name: 'Drift Circuit',
        description: 'R4-inspired high-speed drift track',
        difficulty: 3,
        generatePath: () => {
            const points = [];
            const numPoints = 64;

            for (let i = 0; i < numPoints; i++) {
                const t = i / numPoints;
                const theta = t * Math.PI * 2;

                // Flowing radius with smooth variations (2x scale)
                const r = 110 + Math.sin(theta * 2) * 40 + Math.cos(theta * 3) * 24;

                // Elliptical stretch for straight sections
                const x = Math.cos(theta) * r * 1.4;
                const z = Math.sin(theta) * r;

                // Gentle elevation (max ~6 units, scaled with track)
                const y = Math.sin(theta * 2) * 3 + Math.max(0, Math.sin(theta * 4) * 3);

                points.push(new THREE.Vector3(x, y, z));
            }
            return points;
        }
    }
};

// ============= INPUT MANAGER =============
class InputManager {
    constructor() {
        this.keys = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            drift: false,
            pause: false
        };
        this.pausePressed = false;
        this.enterPressed = false;

        // Touch state
        this.isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        this.joystickActive = false;
        this.joystickVector = { x: 0, y: 0 };

        window.addEventListener('keydown', (e) => this.onKeyDown(e));
        window.addEventListener('keyup', (e) => this.onKeyUp(e));

        if (this.isTouchDevice) {
            this.initTouchControls();
        }

        inputLog.info('InputManager initialized', { touch: this.isTouchDevice });
    }

    initTouchControls() {
        const joystickZone = document.getElementById('joystick-zone');
        const joystickBase = document.getElementById('joystick-base');
        const joystickThumb = document.getElementById('joystick-thumb');
        const driftBtn = document.getElementById('drift-btn');
        const pauseBtn = document.getElementById('pause-btn');

        if (!joystickZone) return;

        const baseRect = () => joystickBase.getBoundingClientRect();
        const maxDist = 45; // Max thumb movement from center

        const updateJoystick = (clientX, clientY) => {
            const rect = baseRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joystickThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

            // Normalize to -1 to 1
            this.joystickVector.x = dx / maxDist;
            this.joystickVector.y = dy / maxDist;

            // Update keys based on joystick position
            const threshold = 0.2;
            this.keys.left = this.joystickVector.x < -threshold;
            this.keys.right = this.joystickVector.x > threshold;
            this.keys.forward = this.joystickVector.y < -threshold;
            this.keys.backward = this.joystickVector.y > threshold;
        };

        const resetJoystick = () => {
            this.joystickActive = false;
            joystickThumb.style.transform = 'translate(-50%, -50%)';
            joystickThumb.classList.remove('active');
            this.joystickVector = { x: 0, y: 0 };
            this.keys.forward = false;
            this.keys.backward = false;
            this.keys.left = false;
            this.keys.right = false;
        };

        // Touch events for joystick
        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.joystickActive = true;
            joystickThumb.classList.add('active');
            const touch = e.touches[0];
            updateJoystick(touch.clientX, touch.clientY);
        }, { passive: false });

        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (this.joystickActive) {
                const touch = e.touches[0];
                updateJoystick(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        joystickZone.addEventListener('touchend', resetJoystick);
        joystickZone.addEventListener('touchcancel', resetJoystick);

        // Drift button
        if (driftBtn) {
            driftBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                this.keys.drift = true;
                driftBtn.classList.add('active');
            }, { passive: false });

            driftBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                this.keys.drift = false;
                driftBtn.classList.remove('active');
            });

            driftBtn.addEventListener('touchcancel', () => {
                this.keys.drift = false;
                driftBtn.classList.remove('active');
            });
        }

        // Pause button
        if (pauseBtn) {
            pauseBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!this.pausePressed) {
                    this.keys.pause = true;
                    this.pausePressed = true;
                }
            }, { passive: false });

            pauseBtn.addEventListener('touchend', () => {
                this.pausePressed = false;
            });
        }

        inputLog.info('Touch controls initialized');
    }

    showTouchControls(visible) {
        const el = document.getElementById('touch-controls');
        if (el && this.isTouchDevice) {
            el.classList.toggle('hidden', !visible);
        }
    }

    onKeyDown(e) {
        switch(e.code) {
            case 'KeyW': case 'ArrowUp': this.keys.forward = true; break;
            case 'KeyS': case 'ArrowDown': this.keys.backward = true; break;
            case 'KeyA': case 'ArrowLeft': this.keys.left = true; break;
            case 'KeyD': case 'ArrowRight': this.keys.right = true; break;
            case 'Space': this.keys.drift = true; e.preventDefault(); break;
            case 'Escape':
                if (!this.pausePressed) {
                    this.keys.pause = true;
                    this.pausePressed = true;
                }
                break;
            case 'Enter':
                if (!this.enterPressed) {
                    this.keys.enter = true;
                    this.enterPressed = true;
                }
                break;
        }
    }

    onKeyUp(e) {
        switch(e.code) {
            case 'KeyW': case 'ArrowUp': this.keys.forward = false; break;
            case 'KeyS': case 'ArrowDown': this.keys.backward = false; break;
            case 'KeyA': case 'ArrowLeft': this.keys.left = false; break;
            case 'KeyD': case 'ArrowRight': this.keys.right = false; break;
            case 'Space': this.keys.drift = false; break;
            case 'Escape': this.pausePressed = false; break;
            case 'Enter': this.enterPressed = false; break;
        }
    }

    consumePause() {
        const was = this.keys.pause;
        this.keys.pause = false;
        return was;
    }

    consumeEnter() {
        const was = this.keys.enter;
        this.keys.enter = false;
        return was;
    }
}

// ============= KART FACTORY =============
function createKartGeometry(type) {
    const config = KART_TYPES[type];
    const group = new THREE.Group();

    // Main body
    const bodyGeom = new THREE.BoxGeometry(1.2, 0.4, 2);
    const bodyMat = new THREE.MeshStandardMaterial({
        color: config.color,
        metalness: 0.6,
        roughness: 0.4
    });
    const body = new THREE.Mesh(bodyGeom, bodyMat);
    body.position.y = 0.35;
    body.castShadow = true;
    group.add(body);

    // Cockpit
    const cockpitGeom = new THREE.BoxGeometry(0.8, 0.35, 0.9);
    const cockpitMat = new THREE.MeshStandardMaterial({
        color: 0x222222,
        metalness: 0.3,
        roughness: 0.6
    });
    const cockpit = new THREE.Mesh(cockpitGeom, cockpitMat);
    cockpit.position.set(0, 0.55, -0.2);
    group.add(cockpit);

    // Front nose
    const noseGeom = new THREE.BoxGeometry(0.8, 0.25, 0.6);
    const noseMat = new THREE.MeshStandardMaterial({
        color: config.accentColor,
        metalness: 0.7,
        roughness: 0.3
    });
    const nose = new THREE.Mesh(noseGeom, noseMat);
    nose.position.set(0, 0.3, 1.1);
    group.add(nose);

    // Spoiler
    const spoilerGeom = new THREE.BoxGeometry(1.4, 0.08, 0.2);
    const spoilerMat = new THREE.MeshStandardMaterial({
        color: config.accentColor,
        metalness: 0.8,
        roughness: 0.2
    });
    const spoiler = new THREE.Mesh(spoilerGeom, spoilerMat);
    spoiler.position.set(0, 0.7, -0.9);
    group.add(spoiler);

    // Spoiler stands
    const standGeom = new THREE.BoxGeometry(0.08, 0.25, 0.08);
    const standL = new THREE.Mesh(standGeom, spoilerMat);
    standL.position.set(-0.5, 0.55, -0.9);
    group.add(standL);
    const standR = new THREE.Mesh(standGeom, spoilerMat);
    standR.position.set(0.5, 0.55, -0.9);
    group.add(standR);

    // Wheels
    const wheelGeom = new THREE.CylinderGeometry(0.25, 0.25, 0.2, 16);
    const wheelMat = new THREE.MeshStandardMaterial({
        color: 0x111111,
        metalness: 0.2,
        roughness: 0.8
    });

    const wheelPositions = [
        { x: -0.7, z: 0.7, front: true },
        { x: 0.7, z: 0.7, front: true },
        { x: -0.7, z: -0.7, front: false },
        { x: 0.7, z: -0.7, front: false }
    ];

    const wheels = [];
    wheelPositions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeom, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(pos.x, 0.25, pos.z);
        wheel.castShadow = true;
        wheel.userData.isFront = pos.front;
        wheels.push(wheel);
        group.add(wheel);
    });

    group.userData.wheels = wheels;
    return group;
}

class Kart {
    constructor(type, scene) {
        this.type = type;
        this.scene = scene;
        this.config = KART_TYPES[type];
        this.mesh = createKartGeometry(type);
        scene.add(this.mesh);

        // Drift particle system
        this.driftParticles = this.createDriftParticles();
        scene.add(this.driftParticles);

        // Boost flame effect
        this.boostFlame = this.createBoostFlame();
        this.mesh.add(this.boostFlame);

        // Spark particle system for drift boost charging
        this.sparkParticles = this.createSparkParticles();
        scene.add(this.sparkParticles);

        // Physics state - VELOCITY BASED
        this.position = new THREE.Vector3(0, 0, 0);
        this.velocity = new THREE.Vector3(0, 0, 0);
        this.rotation = 0; // Y-axis rotation in radians
        this.angularVelocity = 0;

        // Vertical physics
        this.verticalVelocity = 0;
        this.isGrounded = true;
        this.groundNormal = new THREE.Vector3(0, 1, 0);
        this.previousGroundNormal = new THREE.Vector3(0, 1, 0);

        // Steering state
        this.steeringInput = 0;
        this.steeringAngle = 0;

        // Drift state machine: 'NONE', 'INITIATING', 'DRIFTING', 'EXITING'
        this.driftState = 'NONE';
        this.driftDirection = 0;
        this.driftAngle = 0;
        this.driftTime = 0;
        this.driftBoostLevel = 0;

        // Boost state
        this.boostTimeRemaining = 0;
        this.boostPower = 0;

        // Derived values
        this.forwardSpeed = 0;
        this.lateralSpeed = 0;

        // Visual state
        this.pitch = 0;
        this.roll = 0;

        // Collision
        this.boundingRadius = 1.2;

        // Backwards compatibility
        this.speed = 0;
        this.isDrifting = false;

        kartLog.info('Kart created', { type, stats: this.config.stats });
    }

    update(input, delta) {
        const p = CONFIG.physics;
        const mod = this.config.modifiers;

        // Cap delta to prevent physics explosions
        const dt = Math.min(delta, 0.05);

        // Calculate forward and right vectors
        const forward = new THREE.Vector3(Math.sin(this.rotation), 0, Math.cos(this.rotation));
        const right = new THREE.Vector3(forward.z, 0, -forward.x);

        // Calculate current speeds
        this.forwardSpeed = this.velocity.dot(forward);
        this.lateralSpeed = this.velocity.dot(right);

        // Backwards compatibility
        this.speed = this.forwardSpeed;
        this.isDrifting = this.driftState === 'DRIFTING';

        // Get effective max speed
        const effectiveMaxSpeed = this.getMaxSpeed(mod);

        // ===== STEERING =====
        this.processSteeringInput(input, dt, effectiveMaxSpeed);

        // ===== ACCELERATION / BRAKING =====
        this.processAcceleration(input, dt, forward, mod, effectiveMaxSpeed);

        // ===== DRIFT STATE MACHINE =====
        this.updateDriftState(input, dt, right);

        // ===== APPLY GRIP / TRACTION =====
        this.applyTractionModel(dt, forward, right, effectiveMaxSpeed);

        // ===== BOOST =====
        this.updateBoost(dt, forward);

        // ===== FRICTION =====
        if (this.isGrounded) {
            const frictionForce = this.velocity.clone().multiplyScalar(-p.groundFriction);
            this.velocity.add(frictionForce);
        }

        // ===== SPEED LIMITS =====
        const currentSpeed = this.velocity.length();
        if (currentSpeed > effectiveMaxSpeed) {
            this.velocity.multiplyScalar(effectiveMaxSpeed / currentSpeed);
        }

        // ===== INTEGRATE POSITION =====
        this.position.addScaledVector(this.velocity, dt);

        // Update derived speed values
        this.forwardSpeed = this.velocity.dot(forward);
        this.speed = this.forwardSpeed;

        // ===== UPDATE VISUALS =====
        this.updateVisuals(input, dt);
    }

    getMaxSpeed(mod) {
        const p = CONFIG.physics;
        let maxSpeed = p.maxSpeed * mod.maxSpeed;
        if (this.boostTimeRemaining > 0) {
            maxSpeed += this.boostPower;
        }
        return maxSpeed;
    }

    processSteeringInput(input, dt, effectiveMaxSpeed) {
        const p = CONFIG.physics;

        // Raw steering input (positive = turn left, negative = turn right in Three.js coords)
        let targetSteering = 0;
        if (input.left) targetSteering = 1;
        if (input.right) targetSteering = -1;

        // Fast, responsive steering lerp
        const lerpFactor = 1 - Math.exp(-p.steeringLerpSpeed * dt);
        this.steeringInput = THREE.MathUtils.lerp(this.steeringInput, targetSteering, lerpFactor);

        // Speed-dependent steering reduction
        const speed = Math.abs(this.forwardSpeed);
        let steeringFactor = 1.0;
        if (speed > 5) {
            const speedRatio = Math.min(speed / effectiveMaxSpeed, 1.0);
            steeringFactor = 1.0 - (speedRatio * p.speedSteeringReduction);
        }

        // Air control reduction
        if (!this.isGrounded) {
            steeringFactor *= p.airControl;
        }

        this.steeringAngle = this.steeringInput * p.maxSteeringAngle * steeringFactor;
    }

    processAcceleration(input, dt, forward, mod, effectiveMaxSpeed) {
        const p = CONFIG.physics;

        // Acceleration curve - stronger at low speed
        const getAccelCurve = (speed) => {
            const ratio = Math.abs(speed) / effectiveMaxSpeed;
            return 1.0 - (ratio * ratio * 0.7);
        };

        if (input.forward && this.forwardSpeed < effectiveMaxSpeed) {
            const accelMultiplier = getAccelCurve(this.forwardSpeed);
            const accelForce = p.accelerationForce * mod.acceleration * accelMultiplier * dt;
            this.velocity.addScaledVector(forward, accelForce);
        } else if (input.backward) {
            if (this.forwardSpeed > 5) {
                // Braking
                this.velocity.addScaledVector(forward, -p.brakeForce * dt);
            } else {
                // Reverse
                const reverseForce = p.accelerationForce * 0.6 * dt;
                this.velocity.addScaledVector(forward, -reverseForce);
                // Clamp reverse speed
                if (this.forwardSpeed < -p.reverseMaxSpeed) {
                    this.velocity.copy(forward).multiplyScalar(-p.reverseMaxSpeed);
                }
            }
        } else if (this.forwardSpeed > 0 && this.isGrounded) {
            // Coast deceleration
            this.velocity.addScaledVector(forward, -p.coastDeceleration * dt);
            if (this.forwardSpeed < 0) this.velocity.set(0, 0, 0);
        }
    }

    updateDriftState(input, dt, right) {
        const p = CONFIG.physics;
        const speed = Math.abs(this.forwardSpeed);

        switch (this.driftState) {
            case 'NONE':
                // Check for drift initiation: drift button + steering + speed
                if (input.drift && speed > p.driftEntrySpeed && Math.abs(this.steeringInput) > 0.5) {
                    this.driftState = 'INITIATING';
                    this.driftDirection = Math.sign(this.steeringInput);
                    this.driftAngle = 0;
                    this.driftTime = 0;
                    this.driftBoostLevel = 0;
                    kartLog.debug('Drift initiating', { direction: this.driftDirection, speed });
                }
                break;

            case 'INITIATING':
                // Build up drift angle
                this.driftAngle += this.driftDirection * 0.4 * dt * 5;
                this.driftAngle = THREE.MathUtils.clamp(this.driftAngle, -Math.PI * 0.5, Math.PI * 0.5);

                // Transition to full drift
                if (Math.abs(this.driftAngle) > 0.3) {
                    this.driftState = 'DRIFTING';
                    kartLog.debug('Drift active', { driftAngle: this.driftAngle });
                }

                // Cancel if drift released early
                if (!input.drift) {
                    this.driftState = 'EXITING';
                }
                break;

            case 'DRIFTING':
                this.driftTime += dt;

                // Charge boost based on drift time
                for (let i = 0; i < p.driftBoostLevels.length; i++) {
                    if (this.driftTime >= p.driftBoostLevels[i]) {
                        this.driftBoostLevel = i + 1;
                    }
                }

                // Counter-steering affects drift angle
                const counterSteer = -this.steeringInput * this.driftDirection;
                if (counterSteer > 0) {
                    this.driftAngle -= counterSteer * p.driftCounterSteer * dt;
                } else {
                    this.driftAngle += Math.abs(this.steeringInput) * p.driftCounterSteer * dt * 0.5;
                }

                // Maintain minimum drift angle
                const minAngle = 0.2;
                if (Math.abs(this.driftAngle) < minAngle) {
                    this.driftAngle = minAngle * this.driftDirection;
                }

                // Clamp drift angle
                this.driftAngle = THREE.MathUtils.clamp(this.driftAngle, -Math.PI * 0.4, Math.PI * 0.4);

                // Apply drift physics - reduce lateral grip
                const lateralGripForce = -this.lateralSpeed * p.gripCoefficient * p.driftGripMultiplier;
                this.velocity.addScaledVector(right, lateralGripForce * dt);

                // Exit conditions
                if (!input.drift || speed < p.driftEntrySpeed * 0.5) {
                    this.driftState = 'EXITING';
                }
                break;

            case 'EXITING':
                // Apply boost if earned
                if (this.driftBoostLevel > 0) {
                    const level = this.driftBoostLevel - 1;
                    this.boostPower = p.driftBoostPower[level];
                    this.boostTimeRemaining = p.driftBoostDuration[level];
                    kartLog.info('Drift boost activated', {
                        level: this.driftBoostLevel,
                        power: this.boostPower,
                        duration: this.boostTimeRemaining
                    });
                }

                // Reset drift state
                this.driftState = 'NONE';
                this.driftDirection = 0;
                this.driftAngle = 0;
                this.driftTime = 0;
                this.driftBoostLevel = 0;
                break;
        }
    }

    applyTractionModel(dt, forward, right, effectiveMaxSpeed) {
        const p = CONFIG.physics;

        if (!this.isGrounded) {
            // Reduced turning in air - steering still works but less effective
            const turnDir = this.forwardSpeed >= 0 ? 1 : -1;
            this.angularVelocity = this.steeringAngle * p.steeringSensitivity * p.airControl * turnDir;
        } else if (Math.abs(this.forwardSpeed) > 5) {
            // Ground turning - arcade style
            // Turn direction flips when reversing (natural car behavior)
            const turnDir = this.forwardSpeed > 0 ? 1 : -1;
            this.angularVelocity = this.steeringAngle * p.steeringSensitivity * turnDir;

            // Apply lateral grip (not during drift)
            if (this.driftState !== 'DRIFTING' && this.driftState !== 'INITIATING') {
                const lateralGripForce = -this.lateralSpeed * p.gripCoefficient;
                this.velocity.addScaledVector(right, lateralGripForce * dt);
            }
        } else {
            this.angularVelocity = 0;
        }

        // Update rotation
        this.rotation += this.angularVelocity * dt;
    }

    updateBoost(dt, forward) {
        if (this.boostTimeRemaining > 0) {
            this.boostTimeRemaining -= dt;

            // Apply boost acceleration
            const boostAccel = 200 * dt * (this.boostPower / CONFIG.physics.driftBoostPower[2]);
            this.velocity.addScaledVector(forward, boostAccel);
        } else {
            this.boostPower = 0;
        }
    }

    applyGroundPhysics(groundHeight, groundNormal, dt) {
        const p = CONFIG.physics;

        // Store previous ground normal for ramp detection
        this.previousGroundNormal.copy(this.groundNormal);

        const currentHeight = this.position.y;
        const penetration = groundHeight - currentHeight;

        // Spring-damper suspension
        const springForce = p.groundSpringStiffness * penetration;
        const dampingForce = -p.groundSpringDamping * this.verticalVelocity;
        const totalForce = springForce + dampingForce;

        this.verticalVelocity += totalForce * dt;

        // Check grounded state
        if (penetration > -0.3 && this.verticalVelocity <= 0) {
            this.isGrounded = true;
            this.groundNormal.copy(groundNormal);

            // Snap to ground if very close
            if (penetration > -0.1 && Math.abs(this.verticalVelocity) < 2) {
                this.position.y = groundHeight;
                this.verticalVelocity = 0;
            }
        }

        // Check for ramp launch
        this.checkRampLaunch(groundNormal);
    }

    applyGravity(dt) {
        const p = CONFIG.physics;

        if (!this.isGrounded) {
            this.verticalVelocity -= p.gravity * dt;
            this.verticalVelocity = Math.max(this.verticalVelocity, -p.terminalVelocity);
        }

        this.position.y += this.verticalVelocity * dt;
    }

    checkRampLaunch(currentNormal) {
        const p = CONFIG.physics;

        if (!this.isGrounded) return;
        if (Math.abs(this.forwardSpeed) < p.rampSpeedThreshold) return;

        // Calculate slope angles
        const prevAngle = Math.acos(THREE.MathUtils.clamp(this.previousGroundNormal.y, -1, 1));
        const currAngle = Math.acos(THREE.MathUtils.clamp(currentNormal.y, -1, 1));
        const angleChange = prevAngle - currAngle;

        // Check if going uphill and leaving a ramp
        const forward = new THREE.Vector3(Math.sin(this.rotation), 0, Math.cos(this.rotation));
        const slopeDir = new THREE.Vector3(this.previousGroundNormal.x, 0, this.previousGroundNormal.z).normalize();
        const goingUphill = forward.dot(slopeDir) < -0.3;

        if (angleChange > p.minRampAngle && goingUphill && currAngle < prevAngle * 0.5) {
            // Launch!
            const effectiveAngle = Math.min(prevAngle, 0.7);
            const launchPower = Math.abs(this.forwardSpeed) * p.rampLaunchMultiplier;

            this.verticalVelocity = launchPower * Math.sin(effectiveAngle);
            this.isGrounded = false;

            kartLog.info('Ramp launch', { launchVelocity: this.verticalVelocity, speed: this.forwardSpeed });
        }
    }

    applyCollision(normal, penetration) {
        const p = CONFIG.physics;

        // Push out of wall
        this.position.addScaledVector(normal, penetration + 0.1);

        // Calculate velocity direction
        const velocityDir = new THREE.Vector3(Math.sin(this.rotation), 0, Math.cos(this.rotation));

        // Dot product to determine impact angle
        const impactAngle = velocityDir.dot(normal);

        if (impactAngle > p.glanceAngleThreshold) {
            return; // Moving away from wall
        }

        const speed = Math.abs(this.forwardSpeed);
        const impactSeverity = Math.abs(impactAngle);

        if (speed > p.minBounceSpeed && impactSeverity > 0.5) {
            // Significant impact - apply bounce
            const reflection = velocityDir.clone().sub(normal.clone().multiplyScalar(2 * impactAngle));
            this.rotation = Math.atan2(reflection.x, reflection.z);

            // Apply speed loss with bounce
            const speedLoss = p.wallSpeedLoss * (1 - impactSeverity * (1 - p.wallBounce));
            this.velocity.multiplyScalar(speedLoss);

            kartLog.debug('Wall bounce', { impactAngle, speedLoss });
        } else {
            // Glancing hit - slide along wall
            const slideDir = velocityDir.clone().sub(normal.clone().multiplyScalar(impactAngle)).normalize();
            if (slideDir.length() > 0.1) {
                this.rotation = Math.atan2(slideDir.x, slideDir.z);
            }
            this.velocity.multiplyScalar(p.wallSpeedLoss + (1 - p.wallSpeedLoss) * (1 - impactSeverity));
        }
    }

    updateVisuals(input, dt) {
        // Update mesh position
        this.mesh.position.copy(this.position);

        // Calculate visual yaw (add drift angle during drift)
        let visualYaw = this.rotation;
        if (this.driftState === 'DRIFTING' || this.driftState === 'INITIATING') {
            visualYaw += this.driftAngle * 0.7;
        }

        // Update orientation with pitch and roll
        this.updateOrientation(dt);

        this.mesh.rotation.order = 'YXZ';
        this.mesh.rotation.y = visualYaw;
        this.mesh.rotation.x = this.pitch;
        this.mesh.rotation.z = this.roll;

        // Animate wheels
        this.updateWheelVisuals(dt);
    }

    updateOrientation(dt) {
        if (this.isGrounded) {
            // Pitch from ground slope
            const forward = new THREE.Vector3(Math.sin(this.rotation), 0, Math.cos(this.rotation));
            const slopeDot = forward.x * this.groundNormal.x + forward.z * this.groundNormal.z;
            const targetPitch = -Math.asin(THREE.MathUtils.clamp(slopeDot, -0.8, 0.8)) * 0.6;

            // Roll from turning and lateral velocity
            const turnRoll = -this.angularVelocity * 0.15;
            const lateralRoll = -this.lateralSpeed * 0.003;
            const driftRoll = this.driftState === 'DRIFTING' ? -this.driftDirection * 0.1 : 0;
            const targetRoll = THREE.MathUtils.clamp(turnRoll + lateralRoll + driftRoll, -0.4, 0.4);

            this.pitch = THREE.MathUtils.lerp(this.pitch, targetPitch, 1 - Math.exp(-10 * dt));
            this.roll = THREE.MathUtils.lerp(this.roll, targetRoll, 1 - Math.exp(-8 * dt));
        } else {
            // In air, slowly return to level
            this.pitch = THREE.MathUtils.lerp(this.pitch, 0, 1 - Math.exp(-2 * dt));
            this.roll = THREE.MathUtils.lerp(this.roll, 0, 1 - Math.exp(-2 * dt));
        }
    }

    updateWheelVisuals(dt) {
        const wheels = this.mesh.userData.wheels;

        wheels.forEach(wheel => {
            // Wheel spin based on forward speed
            wheel.rotation.x += this.forwardSpeed * 0.15 * dt;

            // Front wheel steering
            if (wheel.userData.isFront) {
                let steerAngle = this.steeringAngle * 0.8;
                if (this.driftState === 'DRIFTING') {
                    steerAngle = -this.driftDirection * 0.4;
                }
                wheel.rotation.y = steerAngle;
            }
        });

        // Update drift particles
        this.updateDriftParticles(dt);

        // Update spark particles
        this.updateSparkParticles(dt);

        // Update boost flame
        this.updateBoostFlame(dt);
    }

    createDriftParticles() {
        const particleCount = 50;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        const lifetimes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = 0;
            positions[i * 3 + 1] = -100; // Start off-screen
            positions[i * 3 + 2] = 0;
            colors[i * 3] = 1;
            colors[i * 3 + 1] = 1;
            colors[i * 3 + 2] = 1;
            sizes[i] = 0;
            lifetimes[i] = 0;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const material = new THREE.PointsMaterial({
            size: 0.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        particles.userData.lifetimes = lifetimes;
        particles.userData.velocities = new Float32Array(particleCount * 3);
        particles.userData.nextParticle = 0;

        return particles;
    }

    updateDriftParticles(dt) {
        if (!this.driftParticles) return;

        const positions = this.driftParticles.geometry.attributes.position.array;
        const colors = this.driftParticles.geometry.attributes.color.array;
        const lifetimes = this.driftParticles.userData.lifetimes;
        const velocities = this.driftParticles.userData.velocities;
        const particleCount = lifetimes.length;

        // Update existing particles
        for (let i = 0; i < particleCount; i++) {
            if (lifetimes[i] > 0) {
                lifetimes[i] -= dt;

                // Move particle
                positions[i * 3] += velocities[i * 3] * dt;
                positions[i * 3 + 1] += velocities[i * 3 + 1] * dt;
                positions[i * 3 + 2] += velocities[i * 3 + 2] * dt;

                // Rise and slow down
                velocities[i * 3 + 1] += 2 * dt;
                velocities[i * 3] *= 0.98;
                velocities[i * 3 + 2] *= 0.98;

                // Fade out
                const alpha = lifetimes[i] / 0.8;
                colors[i * 3] = alpha;
                colors[i * 3 + 1] = alpha;
                colors[i * 3 + 2] = alpha;
            }
        }

        // Spawn new particles when drifting
        if (this.driftState === 'DRIFTING' && Math.abs(this.forwardSpeed) > 30) {
            const spawnRate = 15; // Particles per second
            const spawnCount = Math.floor(spawnRate * dt) + (Math.random() < (spawnRate * dt % 1) ? 1 : 0);

            for (let s = 0; s < spawnCount; s++) {
                const i = this.driftParticles.userData.nextParticle;
                this.driftParticles.userData.nextParticle = (i + 1) % particleCount;

                // Spawn at rear wheel position
                const side = Math.random() > 0.5 ? 1 : -1;
                const cos = Math.cos(this.rotation);
                const sin = Math.sin(this.rotation);
                const localX = side * 0.7;
                const localZ = -0.7;

                positions[i * 3] = this.position.x + localX * cos - localZ * sin;
                positions[i * 3 + 1] = this.position.y + 0.1;
                positions[i * 3 + 2] = this.position.z + localX * sin + localZ * cos;

                // Random velocity
                velocities[i * 3] = (Math.random() - 0.5) * 2;
                velocities[i * 3 + 1] = Math.random() * 2;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 2;

                lifetimes[i] = 0.5 + Math.random() * 0.3;

                // Color based on boost level
                if (this.driftBoostLevel >= 3) {
                    colors[i * 3] = 0;
                    colors[i * 3 + 1] = 1;
                    colors[i * 3 + 2] = 1;
                } else if (this.driftBoostLevel >= 2) {
                    colors[i * 3] = 1;
                    colors[i * 3 + 1] = 0.6;
                    colors[i * 3 + 2] = 0;
                } else if (this.driftBoostLevel >= 1) {
                    colors[i * 3] = 1;
                    colors[i * 3 + 1] = 1;
                    colors[i * 3 + 2] = 0;
                } else {
                    colors[i * 3] = 0.8;
                    colors[i * 3 + 1] = 0.8;
                    colors[i * 3 + 2] = 0.8;
                }
            }
        }

        this.driftParticles.geometry.attributes.position.needsUpdate = true;
        this.driftParticles.geometry.attributes.color.needsUpdate = true;
    }

    createBoostFlame() {
        const flameGeom = new THREE.ConeGeometry(0.15, 0.8, 8);
        const flameMat = new THREE.MeshBasicMaterial({
            color: 0x00aaff,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
        });

        const flame = new THREE.Mesh(flameGeom, flameMat);
        flame.rotation.x = Math.PI / 2;
        flame.position.set(0, 0.3, -1.2);

        return flame;
    }

    updateBoostFlame(dt) {
        if (!this.boostFlame) return;

        if (this.boostTimeRemaining > 0) {
            // Show and animate flame
            this.boostFlame.material.opacity = 0.8 + Math.random() * 0.2;
            this.boostFlame.scale.setScalar(1 + Math.random() * 0.3);

            // Color based on boost power
            const intensity = this.boostPower / CONFIG.physics.driftBoostPower[2];
            if (intensity > 0.8) {
                this.boostFlame.material.color.setHex(0x00ffff);
            } else if (intensity > 0.5) {
                this.boostFlame.material.color.setHex(0xffaa00);
            } else {
                this.boostFlame.material.color.setHex(0xffff00);
            }
        } else {
            this.boostFlame.material.opacity = 0;
        }
    }

    createSparkParticles() {
        const particleCount = 30;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);
        const lifetimes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = 0;
            positions[i * 3 + 1] = -100;
            positions[i * 3 + 2] = 0;
            colors[i * 3] = 1;
            colors[i * 3 + 1] = 0.5;
            colors[i * 3 + 2] = 0;
            sizes[i] = 0;
            lifetimes[i] = 0;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const material = new THREE.PointsMaterial({
            size: 0.3,
            vertexColors: true,
            transparent: true,
            opacity: 1.0,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        particles.userData.lifetimes = lifetimes;
        particles.userData.velocities = new Float32Array(particleCount * 3);
        particles.userData.nextParticle = 0;

        return particles;
    }

    updateSparkParticles(dt) {
        if (!this.sparkParticles) return;

        const positions = this.sparkParticles.geometry.attributes.position.array;
        const colors = this.sparkParticles.geometry.attributes.color.array;
        const sizes = this.sparkParticles.geometry.attributes.size.array;
        const lifetimes = this.sparkParticles.userData.lifetimes;
        const velocities = this.sparkParticles.userData.velocities;
        const particleCount = lifetimes.length;

        // Update existing spark particles
        for (let i = 0; i < particleCount; i++) {
            if (lifetimes[i] > 0) {
                lifetimes[i] -= dt;

                // Move particle
                positions[i * 3] += velocities[i * 3] * dt;
                positions[i * 3 + 1] += velocities[i * 3 + 1] * dt;
                positions[i * 3 + 2] += velocities[i * 3 + 2] * dt;

                // Apply gravity to sparks
                velocities[i * 3 + 1] -= 15 * dt;

                // Slow down horizontally
                velocities[i * 3] *= 0.95;
                velocities[i * 3 + 2] *= 0.95;

                // Fade out and shrink
                const alpha = Math.min(lifetimes[i] / 0.3, 1.0);
                sizes[i] = alpha * 0.3;

                // Keep bright orange/yellow color
                colors[i * 3] = 1.0;
                colors[i * 3 + 1] = 0.5 + alpha * 0.3;
                colors[i * 3 + 2] = alpha * 0.2;
            } else {
                sizes[i] = 0;
            }
        }

        // Spawn sparks when drifting and charging boost (but not at max level yet)
        if (this.driftState === 'DRIFTING' && this.driftBoostLevel > 0 && this.driftBoostLevel < 3) {
            const spawnRate = 25;
            const spawnCount = Math.floor(spawnRate * dt) + (Math.random() < (spawnRate * dt % 1) ? 1 : 0);

            for (let s = 0; s < spawnCount; s++) {
                const i = this.sparkParticles.userData.nextParticle;
                this.sparkParticles.userData.nextParticle = (i + 1) % particleCount;

                // Spawn at rear wheel positions
                const side = Math.random() > 0.5 ? 1 : -1;
                const cos = Math.cos(this.rotation);
                const sin = Math.sin(this.rotation);
                const localX = side * 0.7;
                const localZ = -0.7;

                positions[i * 3] = this.position.x + localX * cos - localZ * sin;
                positions[i * 3 + 1] = this.position.y + 0.05;
                positions[i * 3 + 2] = this.position.z + localX * sin + localZ * cos;

                // Random scattered velocity
                const scatter = 8;
                velocities[i * 3] = (Math.random() - 0.5) * scatter;
                velocities[i * 3 + 1] = Math.random() * 3 + 1;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * scatter;

                lifetimes[i] = 0.2 + Math.random() * 0.2;

                // Color based on boost level
                if (this.driftBoostLevel >= 2) {
                    // Orange sparks for level 2
                    colors[i * 3] = 1.0;
                    colors[i * 3 + 1] = 0.4;
                    colors[i * 3 + 2] = 0;
                } else {
                    // Yellow sparks for level 1
                    colors[i * 3] = 1.0;
                    colors[i * 3 + 1] = 0.8;
                    colors[i * 3 + 2] = 0;
                }

                sizes[i] = 0.3;
            }
        }

        this.sparkParticles.geometry.attributes.position.needsUpdate = true;
        this.sparkParticles.geometry.attributes.color.needsUpdate = true;
        this.sparkParticles.geometry.attributes.size.needsUpdate = true;
    }

    reset(position, rotation) {
        this.position.copy(position);
        this.rotation = rotation;
        this.velocity.set(0, 0, 0);
        this.verticalVelocity = 0;
        this.angularVelocity = 0;
        this.steeringInput = 0;
        this.steeringAngle = 0;
        this.isGrounded = true;
        this.groundNormal.set(0, 1, 0);
        this.previousGroundNormal.set(0, 1, 0);
        this.driftState = 'NONE';
        this.driftDirection = 0;
        this.driftAngle = 0;
        this.driftTime = 0;
        this.driftBoostLevel = 0;
        this.boostTimeRemaining = 0;
        this.boostPower = 0;
        this.pitch = 0;
        this.roll = 0;
        this.speed = 0;
        this.isDrifting = false;
        this.mesh.position.copy(position);
        this.mesh.rotation.set(0, rotation, 0);
    }

    dispose() {
        this.mesh.traverse(child => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
        });
        this.mesh.parent?.remove(this.mesh);

        // Clean up particles
        if (this.driftParticles) {
            this.driftParticles.geometry.dispose();
            this.driftParticles.material.dispose();
            this.scene.remove(this.driftParticles);
        }

        if (this.sparkParticles) {
            this.sparkParticles.geometry.dispose();
            this.sparkParticles.material.dispose();
            this.scene.remove(this.sparkParticles);
        }

        if (this.boostFlame) {
            this.boostFlame.geometry.dispose();
            this.boostFlame.material.dispose();
        }
    }
}

// ============= TRACK GENERATOR =============
class TrackGenerator {
    constructor(scene) {
        this.scene = scene;
        this.trackMesh = null;
        this.barrierMeshes = [];
        this.barrierColliders = []; // For collision detection
        this.groundMesh = null;
        this.checkpoints = [];
        this.trackPath = null;
        this.trackWidth = 36;
        this.innerPoints = [];
        this.outerPoints = [];
    }

    generate(trackKey) {
        this.clear();
        trackLog.info('Generating track', { trackKey });

        const preset = TRACK_PRESETS[trackKey];
        const pathPoints = preset.generatePath();

        // Create smooth spline
        this.trackPath = new THREE.CatmullRomCurve3(pathPoints, true);

        // Generate road mesh
        this.generateRoadMesh();

        // Generate barriers
        this.generateBarriers();

        // Generate stadium lights
        this.generateStadiumLights();

        // Generate ground plane
        this.generateGround();

        // Generate checkpoints
        this.generateCheckpoints();

        // Add start/finish line
        this.generateStartLine();

        trackLog.info('Track generated', {
            trackName: preset.name,
            pathPoints: pathPoints.length,
            checkpoints: this.checkpoints.length
        });

        return {
            startPosition: this.getStartPosition(),
            startRotation: this.getStartRotation(),
            checkpoints: this.checkpoints
        };
    }

    generateRoadMesh() {
        const segments = 200;
        const halfWidth = this.trackWidth / 2;

        const positions = [];
        const indices = [];
        const uvs = [];

        this.innerPoints = [];
        this.outerPoints = [];

        // Calculate curvature for banking
        const curvatures = [];
        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const tBefore = Math.max(0, (i - 1) / segments);
            const tAfter = Math.min(1, (i + 1) / segments);

            const pBefore = this.trackPath.getPointAt(tBefore);
            const pCurrent = this.trackPath.getPointAt(t);
            const pAfter = this.trackPath.getPointAt(tAfter);

            const v1 = new THREE.Vector3().subVectors(pCurrent, pBefore).normalize();
            const v2 = new THREE.Vector3().subVectors(pAfter, pCurrent).normalize();
            const curvature = v1.cross(v2).y;
            curvatures.push(curvature);
        }

        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const point = this.trackPath.getPointAt(t);
            const tangent = this.trackPath.getTangentAt(t);

            const right = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

            const inner = point.clone().addScaledVector(right, -halfWidth);
            const outer = point.clone().addScaledVector(right, halfWidth);

            inner.y += 0.05;
            outer.y += 0.05;

            // Apply banking based on curvature
            const bankingHeight = Math.abs(curvatures[i]) * halfWidth * 0.4;
            if (curvatures[i] > 0.02) {
                outer.y += bankingHeight;
            } else if (curvatures[i] < -0.02) {
                inner.y += bankingHeight;
            }

            this.innerPoints.push(inner);
            this.outerPoints.push(outer);

            positions.push(inner.x, inner.y, inner.z);
            positions.push(outer.x, outer.y, outer.z);

            uvs.push(0, t * 20);
            uvs.push(1, t * 20);

            if (i < segments) {
                const idx = i * 2;
                indices.push(idx, idx + 1, idx + 2);
                indices.push(idx + 1, idx + 3, idx + 2);
            }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();

        // Enhanced road texture with racing line
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#3a3a3a';
        ctx.fillRect(0, 0, 128, 512);

        // Racing line (darker optimal path)
        const racingLineGradient = ctx.createLinearGradient(45, 0, 55, 0);
        racingLineGradient.addColorStop(0, '#3a3a3a');
        racingLineGradient.addColorStop(0.5, '#2a2a2a');
        racingLineGradient.addColorStop(1, '#3a3a3a');
        ctx.fillStyle = racingLineGradient;
        ctx.fillRect(45, 0, 10, 512);

        // Center line (dashed yellow)
        ctx.fillStyle = '#ffff00';
        for (let y = 0; y < 512; y += 32) {
            ctx.fillRect(60, y, 8, 20);
        }

        // Edge lines
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(4, 0, 4, 512);
        ctx.fillRect(120, 0, 4, 512);

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;

        const material = new THREE.MeshStandardMaterial({
            map: texture,
            roughness: 0.8,
            metalness: 0.1
        });

        this.trackMesh = new THREE.Mesh(geometry, material);
        this.trackMesh.receiveShadow = true;
        this.scene.add(this.trackMesh);

        // Store curvatures for decorations
        this.trackCurvatures = curvatures;
    }

    generateBarriers() {
        const barrierRadius = 0.45; // Collision radius for tire stacks

        // Create tire stack geometry
        const tireGeom = new THREE.TorusGeometry(0.3, 0.15, 8, 16);
        const tireMat = new THREE.MeshStandardMaterial({
            color: 0x222222,
            roughness: 0.9
        });

        // Clear previous colliders
        this.barrierColliders = [];

        // Create barriers along inner and outer edges
        [this.innerPoints, this.outerPoints].forEach((points, side) => {
            const isInner = side === 0;

            for (let i = 0; i < points.length - 1; i += 4) {
                const p = points[i];
                const next = points[Math.min(i + 1, points.length - 1)];

                const barrierPos = new THREE.Vector3(
                    p.x + (next.x - p.x) * 0.5,
                    0.45,
                    p.z + (next.z - p.z) * 0.5
                );

                // Calculate normal pointing toward track center
                const tangent = new THREE.Vector3(next.x - p.x, 0, next.z - p.z).normalize();
                const normal = new THREE.Vector3(tangent.z, 0, -tangent.x);
                if (isInner) normal.negate();

                // Store collider data
                this.barrierColliders.push({
                    position: barrierPos.clone(),
                    radius: barrierRadius,
                    normal: normal
                });

                // Tire stack mesh
                const tire = new THREE.Mesh(tireGeom, tireMat);
                tire.position.copy(barrierPos);
                tire.position.y = 0.3;
                tire.rotation.x = Math.PI / 2;
                tire.castShadow = true;
                this.scene.add(tire);
                this.barrierMeshes.push(tire);

                // Stack a second tire
                const tire2 = tire.clone();
                tire2.position.y = 0.6;
                this.scene.add(tire2);
                this.barrierMeshes.push(tire2);
            }
        });

        trackLog.debug('Barrier colliders created', { count: this.barrierColliders.length });
    }

    generateStadiumLights() {
        const poleGeometry = new THREE.CylinderGeometry(0.3, 0.4, 15, 8);
        const poleMaterial = new THREE.MeshStandardMaterial({
            color: 0x666666,
            roughness: 0.7,
            metalness: 0.3
        });

        const lightGeometry = new THREE.BoxGeometry(3, 0.5, 0.5);
        const lightMaterial = new THREE.MeshStandardMaterial({
            color: 0xffff99,
            emissive: 0xffff66,
            emissiveIntensity: 0.8,
            roughness: 0.3
        });

        const numLights = Math.floor(this.outerPoints.length / 15);

        for (let i = 0; i < numLights; i++) {
            const idx = Math.floor(i * this.outerPoints.length / numLights);
            const point = this.outerPoints[idx];
            const nextIdx = (idx + 1) % this.outerPoints.length;
            const nextPoint = this.outerPoints[nextIdx];

            const tangent = new THREE.Vector3().subVectors(nextPoint, point).normalize();
            const outward = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

            const polePos = point.clone().addScaledVector(outward, 6);
            polePos.y = 7.5;

            const pole = new THREE.Mesh(poleGeometry, poleMaterial);
            pole.position.copy(polePos);
            pole.castShadow = true;
            this.scene.add(pole);
            this.barrierMeshes.push(pole);

            const light = new THREE.Mesh(lightGeometry, lightMaterial);
            light.position.copy(polePos);
            light.position.y = 15.5;
            light.rotation.y = Math.atan2(tangent.x, tangent.z);
            this.scene.add(light);
            this.barrierMeshes.push(light);
        }
    }

    generateGround() {
        // Ground removed - floating track aesthetic
    }

    generateCheckpoints() {
        const numCheckpoints = 8;
        this.checkpoints = [];

        for (let i = 0; i < numCheckpoints; i++) {
            const t = i / numCheckpoints;
            const point = this.trackPath.getPointAt(t);
            const tangent = this.trackPath.getTangentAt(t);
            const right = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

            this.checkpoints.push({
                position: point.clone(),
                direction: tangent.clone(),
                right: right.clone(),
                width: this.trackWidth,
                index: i,
                isFinishLine: i === 0
            });
        }
    }

    generateStartLine() {
        const startPoint = this.trackPath.getPointAt(0);
        const tangent = this.trackPath.getTangentAt(0);
        const right = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

        // Start/finish line
        const lineGeom = new THREE.PlaneGeometry(this.trackWidth, 2);

        // Checkerboard texture
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 32;
        const ctx = canvas.getContext('2d');

        const squareSize = 16;
        for (let x = 0; x < 128; x += squareSize) {
            for (let y = 0; y < 32; y += squareSize) {
                ctx.fillStyle = ((x + y) / squareSize) % 2 === 0 ? '#ffffff' : '#000000';
                ctx.fillRect(x, y, squareSize, squareSize);
            }
        }

        const texture = new THREE.CanvasTexture(canvas);

        const lineMat = new THREE.MeshStandardMaterial({
            map: texture,
            roughness: 0.5
        });

        const line = new THREE.Mesh(lineGeom, lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.copy(startPoint);
        line.position.y = 0.1;
        line.rotation.z = Math.atan2(tangent.x, tangent.z);
        this.scene.add(line);
        this.barrierMeshes.push(line);
    }

    getStartPosition() {
        const point = this.trackPath.getPointAt(0.02); // Slightly ahead of start line
        return new THREE.Vector3(point.x, 0, point.z);
    }

    getStartRotation() {
        const tangent = this.trackPath.getTangentAt(0.02);
        return Math.atan2(tangent.x, tangent.z);
    }

    getClosestPointOnTrack(position) {
        let closest = null;
        let minDist = Infinity;
        let closestT = 0;

        // Use 2D distance (XZ plane) for finding closest point
        for (let t = 0; t < 1; t += 0.01) {
            const point = this.trackPath.getPointAt(t);
            const dx = position.x - point.x;
            const dz = position.z - point.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist < minDist) {
                minDist = dist;
                closest = point;
                closestT = t;
            }
        }

        return { point: closest, t: closestT, distance: minDist };
    }

    getTrackHeightAt(position) {
        const result = this.getClosestPointOnTrack(position);
        return result.point ? result.point.y : 0;
    }

    getGroundInfo(position) {
        const result = this.getClosestPointOnTrack(position);

        if (!result.point) {
            return { found: false };
        }

        // Calculate ground normal from track tangent and slope
        const tangent = this.trackPath.getTangentAt(result.t);

        // Get points ahead and behind to calculate slope
        const tAhead = (result.t + 0.01) % 1;
        const tBehind = (result.t - 0.01 + 1) % 1;
        const pointAhead = this.trackPath.getPointAt(tAhead);
        const pointBehind = this.trackPath.getPointAt(tBehind);

        // Calculate forward slope
        const segmentLength = pointAhead.distanceTo(pointBehind) || 1;
        const forwardSlope = (pointAhead.y - pointBehind.y) / segmentLength;

        // Create ground normal (tilted based on slope)
        const normal = new THREE.Vector3(
            -tangent.x * forwardSlope,
            1,
            -tangent.z * forwardSlope
        ).normalize();

        return {
            found: true,
            point: result.point,
            height: result.point.y,
            normal: normal,
            distance: Math.abs(position.y - result.point.y),
            trackT: result.t
        };
    }

    isOnTrack(position) {
        const result = this.getClosestPointOnTrack(position);
        return result.distance < this.trackWidth / 2 + 2;
    }

    getTrackBoundaryCollision(position, radius) {
        const result = this.getClosestPointOnTrack(position);
        const halfWidth = this.trackWidth / 2;

        // First check barrier collisions (tire stacks)
        const barrierCollision = this.checkBarrierCollisions(position, radius);
        if (barrierCollision) {
            barrierCollision.trackHeight = result.point ? result.point.y : 0;
            return barrierCollision;
        }

        if (result.distance > halfWidth - radius) {
            // Calculate push direction in XZ plane (towards center of track)
            const toCenter = new THREE.Vector3(
                result.point.x - position.x,
                0,
                result.point.z - position.z
            ).normalize();

            const penetration = result.distance - (halfWidth - radius);
            return {
                collision: true,
                normal: toCenter,
                penetration: penetration,
                trackHeight: result.point.y
            };
        }

        return { collision: false, trackHeight: result.point ? result.point.y : 0 };
    }

    checkBarrierCollisions(position, radius) {
        for (const barrier of this.barrierColliders) {
            const dx = position.x - barrier.position.x;
            const dz = position.z - barrier.position.z;
            const distance = Math.sqrt(dx * dx + dz * dz);
            const minDist = radius + barrier.radius;

            if (distance < minDist) {
                const normal = new THREE.Vector3(dx, 0, dz);
                if (normal.length() > 0.001) {
                    normal.normalize();
                } else {
                    normal.copy(barrier.normal);
                }

                return {
                    collision: true,
                    normal: normal,
                    penetration: minDist - distance
                };
            }
        }
        return null;
    }

    clear() {
        if (this.trackMesh) {
            this.trackMesh.geometry.dispose();
            this.trackMesh.material.dispose();
            this.scene.remove(this.trackMesh);
        }

        this.barrierMeshes.forEach(mesh => {
            mesh.geometry?.dispose();
            mesh.material?.dispose();
            this.scene.remove(mesh);
        });
        this.barrierMeshes = [];
        this.barrierColliders = [];

        if (this.groundMesh) {
            this.groundMesh.geometry.dispose();
            this.groundMesh.material.dispose();
            this.scene.remove(this.groundMesh);
        }

        this.checkpoints = [];
    }
}

// ============= CHECKPOINT MANAGER =============
class CheckpointManager {
    constructor(checkpoints) {
        this.checkpoints = checkpoints;
        this.currentCheckpoint = 0;
        this.lap = 1;
        this.lapTimes = [];
        this.raceStartTime = 0;
        this.lapStartTime = 0;
        this.finished = false;

        checkpointLog.info('CheckpointManager initialized', { totalCheckpoints: checkpoints.length });
    }

    reset(startTime) {
        this.currentCheckpoint = 0;
        this.lap = 1;
        this.lapTimes = [];
        this.raceStartTime = startTime;
        this.lapStartTime = startTime;
        this.finished = false;
        checkpointLog.info('Race timer reset');
    }

    update(kartPosition, currentTime) {
        if (this.finished) return null;

        const nextCheckpoint = this.checkpoints[this.currentCheckpoint];

        // Check if kart crossed checkpoint
        const toKart = new THREE.Vector3().subVectors(kartPosition, nextCheckpoint.position);
        const alongTrack = toKart.dot(nextCheckpoint.direction);
        const acrossTrack = Math.abs(toKart.dot(nextCheckpoint.right));

        // Checkpoint is crossed when kart passes through it
        if (alongTrack > 0 && alongTrack < 5 && acrossTrack < nextCheckpoint.width / 2) {
            this.currentCheckpoint++;
            checkpointLog.debug('Checkpoint crossed', { checkpoint: this.currentCheckpoint, lap: this.lap });

            // Check for lap completion
            if (this.currentCheckpoint >= this.checkpoints.length) {
                this.currentCheckpoint = 0;
                const lapTime = currentTime - this.lapStartTime;
                this.lapTimes.push(lapTime);
                this.lapStartTime = currentTime;

                if (this.lap >= CONFIG.race.totalLaps) {
                    this.finished = true;
                    const totalTime = currentTime - this.raceStartTime;
                    checkpointLog.info('Race finished', { totalTime, lapTimes: this.lapTimes });
                    return { type: 'finish', lapTime, totalTime };
                }

                this.lap++;
                checkpointLog.info('Lap completed', { lapNumber: this.lap - 1, lapTime });
                return { type: 'lap', lapNumber: this.lap, lapTime };
            }

            return { type: 'checkpoint', index: this.currentCheckpoint };
        }

        return null;
    }

    getTotalTime(currentTime) {
        return currentTime - this.raceStartTime;
    }

    getCurrentLapTime(currentTime) {
        return currentTime - this.lapStartTime;
    }
}

// ============= CAMERA CONTROLLER =============
class CameraController {
    constructor(camera) {
        this.camera = camera;
        this.target = new THREE.Vector3();
        this.currentPosition = new THREE.Vector3();
        this.currentLookAt = new THREE.Vector3();
        this.shakeOffset = new THREE.Vector3();
        this.shakeTime = 0;
    }

    update(kartPosition, kartRotation, kartSpeed, isBoosting = false) {
        const c = CONFIG.camera;

        // Calculate ideal camera position (behind and above kart)
        // Pull camera back more at high speeds
        const speedRatio = Math.abs(kartSpeed) / CONFIG.physics.maxSpeed;
        const dynamicDistance = c.distance + speedRatio * 3;
        const dynamicHeight = c.height + speedRatio * 1;

        const offset = new THREE.Vector3(
            -Math.sin(kartRotation) * dynamicDistance,
            dynamicHeight,
            -Math.cos(kartRotation) * dynamicDistance
        );

        const idealPosition = kartPosition.clone().add(offset);

        // Look ahead point - more look-ahead at high speed
        const dynamicLookAhead = c.lookAheadDistance + speedRatio * 4;
        const lookAhead = new THREE.Vector3(
            Math.sin(kartRotation) * dynamicLookAhead,
            0.5,
            Math.cos(kartRotation) * dynamicLookAhead
        );
        const idealLookAt = kartPosition.clone().add(lookAhead);

        // Smooth interpolation
        this.currentPosition.lerp(idealPosition, c.positionDamping * 60 / (1000/16));
        this.currentLookAt.lerp(idealLookAt, c.rotationDamping * 60 / (1000/16));

        // Boost shake effect
        if (isBoosting) {
            this.shakeTime += 0.5;
            const intensity = c.boostShakeIntensity;
            this.shakeOffset.set(
                (Math.random() - 0.5) * intensity,
                (Math.random() - 0.5) * intensity * 0.5,
                (Math.random() - 0.5) * intensity
            );
        } else {
            this.shakeOffset.lerp(new THREE.Vector3(), 0.2);
        }

        // Update camera with shake
        this.camera.position.copy(this.currentPosition).add(this.shakeOffset);
        this.camera.lookAt(this.currentLookAt);

        // Dynamic FOV based on speed - more dramatic effect
        const targetFov = c.baseFov + speedRatio * (c.maxFov - c.baseFov) * c.fovSpeedScale;
        const boostFovBonus = isBoosting ? 5 : 0;
        this.camera.fov += (targetFov + boostFovBonus - this.camera.fov) * 0.15;
        this.camera.updateProjectionMatrix();
    }

    reset(kartPosition, kartRotation) {
        const c = CONFIG.camera;
        const offset = new THREE.Vector3(
            -Math.sin(kartRotation) * c.distance,
            c.height,
            -Math.cos(kartRotation) * c.distance
        );

        this.currentPosition.copy(kartPosition).add(offset);
        this.currentLookAt.copy(kartPosition);
        this.shakeOffset.set(0, 0, 0);
        this.camera.position.copy(this.currentPosition);
        this.camera.lookAt(this.currentLookAt);
    }
}
